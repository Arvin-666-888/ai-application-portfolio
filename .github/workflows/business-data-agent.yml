name: business-data-agent

on:
  push:
    branches:
      - main
    paths:
      - "business-data-agent/**"
      - "docker-compose.yml"
      - ".github/workflows/business-data-agent.yml"
  pull_request:
    branches:
      - main
    paths:
      - "business-data-agent/**"
      - "docker-compose.yml"
      - ".github/workflows/business-data-agent.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business-data-agent
    env:
      DEBUG: "false"
      SECRET_KEY: ci-only-business-agent-secret-key-over-32-bytes
      DATABASE_URL: sqlite:///business_agent_ci.db
      SAMPLE_DB_PATH: ./sample_data/business_agent_ci_sample.db
      CHART_DIR: ./charts-ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.4"
          cache: pip
          cache-dependency-path: business-data-agent/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Run offline evaluation
        run: python evals/run_agent_eval.py --json
      - name: Run smoke demo
        run: python scripts/smoke_demo.py
