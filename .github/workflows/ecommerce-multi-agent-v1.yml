name: ecommerce-multi-agent-v1

on:
  push:
    paths:
      - "ecommerce-multi-agent-support/**"
      - ".github/workflows/ecommerce-multi-agent-v1.yml"
  pull_request:
    paths:
      - "ecommerce-multi-agent-support/**"
      - ".github/workflows/ecommerce-multi-agent-v1.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-multi-agent-support
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
          cache: pip
          cache-dependency-path: ecommerce-multi-agent-support/requirements.txt
      - name: Install exact dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Run V1 evaluation
        run: python evals/run_eval.py
      - name: Run smoke demo
        run: python scripts/smoke_demo.py
