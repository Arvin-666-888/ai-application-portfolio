services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-financial_platform}
      MYSQL_USER: ${MYSQL_USER:-financial_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-replace-local-app-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-replace-local-root-password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  business-data-agent:
    build:
      context: ./business-data-agent
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-financial_app}:${MYSQL_PASSWORD:-replace-local-app-password}@mysql:3306/${MYSQL_DATABASE:-financial_platform}?charset=utf8mb4
      SECRET_KEY: ${BUSINESS_AGENT_SECRET_KEY:-replace-with-a-long-random-local-secret}
      DEBUG: "false"
      CHART_DIR: /app/data/charts
      SAMPLE_DB_PATH: /app/data/sample.db
    ports:
      - "8001:8000"
    volumes:
      - business_agent_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  business_agent_data:
